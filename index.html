<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Architecture Palette</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="container">
        <h1>Smart Color Generator</h1>
        
        <div class="controls">
            <button id="generate-btn">
                <i class="fas fa-sync-alt"></i> Generate Smart Palette
            </button>
        </div>

        <div id="main-palette" class="palette-container"></div>

        <div class="saved-section">
            <h2><i class="fas fa-heart"></i> Saved Colors</h2>
            <div id="saved-colors-list" class="palette-container"></div>
        </div>
    </div>

    <template id="color-box-template">
        <div class="color-box">
            <div class="color" title="Click to copy"></div>
            <div class="color-info">
                <span class="hex-value"></span>
                <div class="actions">
                    <i class="far fa-copy action-btn copy-btn" title="Copy"></i>
                    <i class="fa-heart action-btn save-btn"></i>
                </div>
            </div>
        </div>
    </template>

    <div id="toast">Hex code copied!</div>
    <script src="script.js"></script>
</body>
</html>
